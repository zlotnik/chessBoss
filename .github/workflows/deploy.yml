name: Deploy ChessBoss backend

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show workflow identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Create Lambda package
        run: |
          chmod +x ./create_lambda_package.sh
          ./create_lambda_package.sh
          test -f chessboss-lambda.zip

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ChessBossAPI \
            --zip-file fileb://chessboss-lambda.zip

      - name: Wait for deployment
        run: |
          aws lambda wait function-updated \
            --function-name ChessBossAPI